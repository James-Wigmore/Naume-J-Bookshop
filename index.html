<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Naume-J">
<link rel="manifest" href='data:application/manifest+json,{"name":"Naume-J Chalk Making %26 Bookshop","short_name":"Naume-J","start_url":".","display":"standalone","background_color":"%231e3b2c","theme_color":"%231e3b2c"}'>
<title>Naume-J | Chalk Making &amp; Bookshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#1e3b2c;
    --board-2:#234531;
    --board-3:#2a5138;
    --chalk:#f4f1e6;
    --chalk-dim:#c9cbb8;
    --chalk-yellow:#e8c468;
    --chalk-pink:#e08a9c;
    --chalk-blue:#8fc1d9;
    --rail:#5b4632;
    --rail-dark:#43331f;
    --danger:#e08a7f;
    --good:#9bd0a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(ellipse at 80% 80%, rgba(255,255,255,0.025), transparent 45%),
      var(--board);
    color:var(--chalk);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:0;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 60px;}

  .rail{
    height:14px;
    background:linear-gradient(180deg,var(--rail) 0%, var(--rail-dark) 100%);
    border-radius:3px;
    margin-bottom:0;
    box-shadow:0 3px 6px rgba(0,0,0,0.3);
  }
  .board{
    background:linear-gradient(180deg, var(--board-2), var(--board));
    border:2px solid var(--rail-dark);
    border-top:none;
    border-radius:0 0 8px 8px;
    padding:32px 32px 24px;
    position:relative;
  }
  .board::after{
    content:"";
    position:absolute;inset:0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.008) 0px, transparent 2px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.006) 0px, transparent 3px, transparent 6px);
    pointer-events:none;
    border-radius:0 0 8px 8px;
  }

  h1{
    font-family:'Kalam',cursive;
    font-size:2.4rem;
    margin:0 0 2px;
    font-weight:700;
    color:var(--chalk);
    letter-spacing:0.5px;
  }
  .logo-wrap{
    display:inline-block;
    background:#ffffff;
    border-radius:12px;
    padding:14px 20px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
    margin-bottom:14px;
    max-width:100%;
  }
  .logo-wrap img{
    display:block;
    height:88px;
    width:auto;
    max-width:100%;
  }
  @media(max-width:500px){
    .logo-wrap img{ height:64px; }
  }
  .subtitle{
    font-family:'Kalam',cursive;
    color:var(--chalk-dim);
    font-size:1.05rem;
    margin:0 0 22px;
  }
  .underline{
    width:220px;height:3px;
    background:var(--chalk-dim);
    opacity:0.5;
    border-radius:2px;
    margin-bottom:24px;
  }

  .tabs{
    display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;
    border-bottom:1px dashed rgba(244,241,230,0.25);
    padding-bottom:0;
  }
  .tab{
    font-family:'Kalam',cursive;
    font-size:1.05rem;
    background:none;border:none;
    color:var(--chalk-dim);
    padding:8px 16px 12px;
    cursor:pointer;
    border-bottom:3px solid transparent;
    transition:all 0.15s;
  }
  .tab:hover{color:var(--chalk);}
  .tab.active{color:var(--chalk-yellow);border-bottom-color:var(--chalk-yellow);}

  .panel{display:none;animation:fade 0.2s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
  .card{
    background:rgba(244,241,230,0.05);
    border:1px solid rgba(244,241,230,0.14);
    border-radius:6px;
    padding:16px 18px;
  }
  .card .label{
    font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--chalk-dim);margin-bottom:6px;
  }
  .card .value{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.5rem;font-weight:600;color:var(--chalk);
  }
  .card.profit .value{color:var(--good);}
  .card.profit.negative .value{color:var(--danger);}
  .card .sub{font-size:0.75rem;color:var(--chalk-dim);margin-top:4px;}

  .hero{
    background:linear-gradient(135deg, rgba(232,196,104,0.08), rgba(244,241,230,0.04));
    border:1px solid rgba(232,196,104,0.3);
    border-radius:8px;
    padding:22px 24px;
    margin-bottom:24px;
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  }
  .hero .label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--chalk-dim);margin-bottom:6px;}
  .hero .value{font-family:'IBM Plex Mono',monospace;font-size:2.1rem;font-weight:600;color:var(--chalk-yellow);}
  .hero .value.negative{color:var(--danger);}
  .trend{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;padding:6px 12px;border-radius:20px;font-weight:600;}
  .trend.up{background:rgba(155,208,160,0.15);color:var(--good);}
  .trend.down{background:rgba(224,138,127,0.15);color:var(--danger);}
  .trend.flat{background:rgba(244,241,230,0.1);color:var(--chalk-dim);}

  h2.section-title{
    font-family:'Kalam',cursive;font-size:1.3rem;color:var(--chalk-yellow);
    margin:28px 0 12px;font-weight:700;
  }
  h2.section-title:first-child{margin-top:0;}

  table{width:100%;border-collapse:collapse;font-size:0.88rem;}
  th{
    text-align:left;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em;
    color:var(--chalk-dim);padding:8px 10px;border-bottom:1px dashed rgba(244,241,230,0.25);
    font-weight:600;
  }
  td{padding:10px;border-bottom:1px solid rgba(244,241,230,0.07);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .empty-row td{color:var(--chalk-dim);font-style:italic;text-align:center;padding:24px;}

  .badge{
    display:inline-block;padding:3px 9px;border-radius:20px;font-size:0.72rem;font-weight:600;
  }
  .badge.due{background:rgba(224,138,127,0.2);color:var(--danger);}
  .badge.soon{background:rgba(232,196,104,0.2);color:var(--chalk-yellow);}
  .badge.ok{background:rgba(155,208,160,0.18);color:var(--good);}
  .badge.type-white{background:rgba(244,241,230,0.15);color:var(--chalk);}
  .badge.type-colored{background:rgba(224,138,127,0.15);color:var(--chalk-pink);}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;
    background:var(--chalk-yellow);color:#2a2410;
    border:none;border-radius:5px;padding:9px 16px;cursor:pointer;
    transition:transform 0.1s, opacity 0.15s;
  }
  .btn:hover{opacity:0.9;transform:translateY(-1px);}
  .btn.secondary{background:transparent;color:var(--chalk);border:1px solid rgba(244,241,230,0.3);}
  .btn.danger-outline{background:transparent;color:var(--danger);border:1px solid rgba(224,138,127,0.5);padding:5px 10px;font-size:0.75rem;}

  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px;}
  label{display:block;font-size:0.72rem;color:var(--chalk-dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em;}
  input, select{
    width:100%;padding:9px 10px;border-radius:5px;
    border:1px solid rgba(244,241,230,0.22);
    background:rgba(0,0,0,0.18);color:var(--chalk);
    font-family:'IBM Plex Mono',monospace;font-size:0.85rem;
  }
  input:focus, select:focus{outline:none;border-color:var(--chalk-yellow);}

  .settings-form{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;}
  .settings-form .form-grid{grid-column:1/-1;}
  @media(max-width:600px){.settings-form{grid-template-columns:1fr;}}

  .note{font-size:0.78rem;color:var(--chalk-dim);margin-top:2px;line-height:1.5;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--chalk-yellow);color:#2a2410;padding:10px 20px;border-radius:6px;
    font-weight:600;font-size:0.85rem;opacity:0;pointer-events:none;transition:opacity 0.25s;
    z-index:100;
  }
  .toast.show{opacity:1;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .loading{color:var(--chalk-dim);font-family:'Kalam',cursive;padding:30px;text-align:center;}

  .role-badge{
    font-family:'IBM Plex Mono',monospace;font-size:0.75rem;
    background:rgba(244,241,230,0.08);border:1px solid rgba(244,241,230,0.2);
    padding:6px 12px;border-radius:20px;color:var(--chalk-dim);
    display:flex;align-items:center;gap:10px;
  }
  .role-badge b{color:var(--chalk-yellow);}
  .role-badge button{
    background:none;border:none;color:var(--chalk-blue);cursor:pointer;
    font-family:'Inter',sans-serif;font-size:0.75rem;text-decoration:underline;padding:0;
  }

  .gate{
    max-width:380px;margin:40px auto;text-align:center;
  }
  .gate h2{font-family:'Kalam',cursive;color:var(--chalk-yellow);font-size:1.4rem;margin-bottom:6px;}
  .gate p{color:var(--chalk-dim);font-size:0.9rem;margin-bottom:22px;}
  .gate-choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .role-choice{
    flex:1;min-width:140px;background:rgba(244,241,230,0.05);
    border:1px solid rgba(244,241,230,0.18);border-radius:8px;
    padding:22px 16px;cursor:pointer;transition:all 0.15s;
  }
  .role-choice:hover{border-color:var(--chalk-yellow);transform:translateY(-2px);}
  .role-choice .icon{font-size:1.8rem;margin-bottom:8px;}
  .role-choice .name{font-family:'Kalam',cursive;font-size:1.1rem;color:var(--chalk);}
  .role-choice .desc{font-size:0.75rem;color:var(--chalk-dim);margin-top:4px;}
  .pin-input{
    font-size:1.4rem;letter-spacing:0.4em;text-align:center;
    max-width:180px;margin:0 auto 14px;
  }
</style>
</head>

<script>
const DEFAULT_SETTINGS = {
  materialCostPer12000: 130000,
  pricePerBox: 3000,
  boxSize: 150,
  moldSize: 200,
  laborPerMold: 500,
  transportPer12000: 15000,
  rentPerMonth: 80000,
  moldsPerDay: 10,
  daysPerMonth: 20,
  pieceDefault: 8500,
  adminPin: "1234",
  lowStockDays: 7,
  colorPricePerBox: 3000,
  colorTinCost: 0,
  colorPiecesPerTin: 3000,
  popPerMoldGrams: 850,
  caco3PerMoldGrams: 50,
  popPricePerKg: 2400,
  caco3PricePerKg: 200
};

function deriveMaterialCostPer12000(s){
  const costPerMold = (s.popPerMoldGrams/1000)*s.popPricePerKg + (s.caco3PerMoldGrams/1000)*s.caco3PricePerKg;
  const costPerPiece = s.moldSize > 0 ? costPerMold / s.moldSize : 0;
  return costPerPiece * 12000;
}

let state = { settings: {...DEFAULT_SETTINGS}, schools: [], production: [], sales: [], assets: [], materialPurchases: [] };
let activeTab = 'dashboard';
let role = null; // 'admin' | 'worker'
let unlocked = false;
let periodFilter = 'this_month';

let customEnd = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);

function fmt(n){

// ---- Google Sheets backend config ----
// Paste the URL you get after deploying the Apps Script web app.
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbwwIqQ7oW1WDrDWEXqzYofMy2NHTAL5lgVX-PKaYsAiBCBDJvtLSBEJlH1Szu2UvPFM/exec';
// Must match the TOKEN value set inside the Apps Script (Code.gs).
const SHEETS_API_TOKEN = '256789575905';

async function sheetsGet(key){
  const url = `${SHEETS_API_URL}?key=${encodeURIComponent(key)}&token=${encodeURIComponent(SHEETS_API_TOKEN)}`;
  const res = await fetch(url, { method: 'GET' });
  if(!res.ok) throw new Error('Network error loading ' + key);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.value; // JSON string or null
}

async function sheetsSet(key, valueString){
  const res = await fetch(SHEETS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify({ key, value: valueString, token: SHEETS_API_TOKEN })
  });
  if(!res.ok) throw new Error('Network error saving ' + key);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadAll(){
  try{
    const v = await sheetsGet('settings');
    if(v) state.settings = {...DEFAULT_SETTINGS, ...JSON.parse(v)};
    state.settings.materialCostPer12000 = deriveMaterialCostPer12000(state.settings);
  }catch(e){ toast('Could not load settings — check connection'); }
  try{
    const v = await sheetsGet('schools');
    if(v) state.schools = JSON.parse(v);
  }catch(e){ toast('Could not load schools'); }
  try{
    const v = await sheetsGet('production');
    if(v) state.production = JSON.parse(v);
  }catch(e){ toast('Could not load production log'); }
  try{
    const v = await sheetsGet('sales');
    if(v) state.sales = JSON.parse(v);
  }catch(e){ toast('Could not load sales log'); }
  try{
    const v = await sheetsGet('assets');
    if(v) state.assets = JSON.parse(v);
  }catch(e){ toast('Could not load assets'); }
  try{
    const v = await sheetsGet('materialPurchases');
    if(v) state.materialPurchases = JSON.parse(v);
  }catch(e){ toast('Could not load material purchases'); }
  renderGate();
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function toCSV(rows, headers){
  const esc = v => {
    const s = String(v ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  };
  const lines = [headers.map(h=>esc(h.label)).join(',')];
  rows.forEach(r => lines.push(headers.map(h=>esc(r[h.key])).join(',')));
  return lines.join('\n');
}

function todayStamp(){ return new Date().toISOString().slice(0,10); }

function exportAllJSON(){
  const backup = {
    exportedAt: new Date().toISOString(),
    appName: 'Naume-J Chalk Making & Bookshop',
    settings: state.settings,
    schools: state.schools,
    production: state.production,
    sales: state.sales,
    assets: state.assets,
    materialPurchases: state.materialPurchases
  };
  downloadFile(`naume-j-backup-${todayStamp()}.json`, JSON.stringify(backup, null, 2), 'application/json');
  toast('Backup downloaded');
}

function exportProductionCSV(){
  const csv = toCSV(state.production.map(p=>({...p, type: p.type==='colored'?'Colored':'White', pieces: p.molds*p.moldSize})),
    [{key:'date',label:'Date'},{key:'type',label:'Type'},{key:'worker',label:'Worker'},{key:'molds',label:'Molds'},{key:'moldSize',label:'Pieces per mold'},{key:'pieces',label:'Total pieces'}]);
  downloadFile(`production-${todayStamp()}.csv`, csv, 'text/csv');
  toast('Production CSV downloaded');
}

function exportSalesCSV(){
  const s = state.settings;
  const csv = toCSV(state.sales.map(x=>({...x, type: x.type==='colored'?'Colored':'White', pieces: x.boxes*s.boxSize})),
    [{key:'date',label:'Date'},{key:'type',label:'Type'},{key:'boxes',label:'Boxes'},{key:'pieces',label:'Pieces'},{key:'buyer',label:'Buyer'}]);
  downloadFile(`sales-${todayStamp()}.csv`, csv, 'text/csv');

}

function exportSchoolsCSV(){
  const rows = state.schools.map(sc => {
    const st = schoolStatus(sc);
    return {name: sc.name, pieces: sc.pieces, lastOrder: sc.lastOrder, nextDue: st.next.toISOString().slice(0,10), status: st.label};

  const csv = toCSV(rows, [{key:'name',label:'School'},{key:'pieces',label:'Pieces per order'},{key:'lastOrder',label:'Last order'},{key:'nextDue',label:'Next due'},{key:'status',label:'Status'}]);
  downloadFile(`schools-${todayStamp()}.csv`, csv, 'text/csv');
  toast('Schools CSV downloaded');
}

function exportAssetsCSV(){
  const rows = state.assets.map(a => ({...a, total: a.cost*a.quantity}));
  const csv = toCSV(rows, [{key:'name',label:'Asset'},{key:'category',label:'Category'},{key:'quantity',label:'Quantity'},{key:'cost',label:'Cost per unit'},{key:'total',label:'Total value'},{key:'date',label:'Date acquired'},{key:'notes',label:'Notes'}]);
  downloadFile(`assets-${todayStamp()}.csv`, csv, 'text/csv');
  toast('Assets CSV downloaded');
}

function exportMaterialsCSV(){
  const csv = toCSV(state.materialPurchases.map(p=>({...p, category: p.category==='colour'?'Colour':'Base'})),
    [{key:'date',label:'Date'},{key:'category',label:'Material'},{key:'amount',label:'Amount (UGX)'},{key:'notes',label:'Notes'}]);
  downloadFile(`materials-${todayStamp()}.csv`, csv, 'text/csv');
  toast('Materials CSV downloaded');
}

async function importBackup(file){
  const statusEl = document.getElementById('import-status');
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object'){ throw new Error('bad format'); }
    if(data.settings) state.settings = {...DEFAULT_SETTINGS, ...data.settings};
    if(Array.isArray(data.schools)) state.schools = data.schools;
    if(Array.isArray(data.production)) state.production = data.production;
    if(Array.isArray(data.sales)) state.sales = data.sales;
    if(Array.isArray(data.assets)) state.assets = data.assets;
    if(Array.isArray(data.materialPurchases)) state.materialPurchases = data.materialPurchases;
    await Promise.all([saveSettings(), saveSchools(), saveProduction(), saveSales(), saveAssets(), saveMaterialPurchases()]);
    if(statusEl) statusEl.textContent = 'Backup restored successfully.';
    toast('Backup restored');
    render();
  }catch(e){
    if(statusEl) statusEl.textContent = "Could not read that file — make sure it's a backup exported from this app.";
  }
}

async function resetAllRecords(){
  state.schools = [];
  state.production = [];
  state.sales = [];
  state.assets = [];
  state.materialPurchases = [];
  await Promise.all([saveSchools(), saveProduction(), saveSales(), saveAssets(), saveMaterialPurchases()]);
  toast('All records cleared');
  render();
}

function monthKey(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

function toDateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function inRange(dateStr, start, end){
  const d = toDateOnly(new Date(dateStr));
  return d >= start && d <= end;
}

function monthsBetween(start, end){
  const count = (end.getFullYear()-start.getFullYear())*12 + (end.getMonth()-start.getMonth()) + 1;
  return Math.max(1, count);
}

function getEarliestDate(){
  const dates = [...state.production.map(p=>p.date), ...state.sales.map(s=>s.date)];
  if(dates.length===0) return toDateOnly(new Date());
  return toDateOnly(new Date(dates.reduce((min,d)=> d<min?d:min, dates[0])));
}

const PERIOD_LABELS = {
  this_month:'This month', last_month:'Last month', last_3_months:'Last 3 months',
  this_year:'This year', all_time:'All time', custom:'Custom range'
};

function getPeriodRange(filter, cs, ce){
  const today = toDateOnly(new Date());
  const y = today.getFullYear(), m = today.getMonth();
  switch(filter){
    case 'last_month': return {start:new Date(y,m-1,1), end:new Date(y,m,0)};
    case 'last_3_months': return {start:new Date(y,m-2,1), end:new Date(y,m+1,0)};
    case 'this_year': return {start:new Date(y,0,1), end:today};
    case 'all_time': return {start:getEarliestDate(), end:today};
    case 'custom':
      return {start: cs ? toDateOnly(new Date(cs)) : new Date(y,m,1), end: ce ? toDateOnly(new Date(ce)) : today};
    default: return {start:new Date(y,m,1), end:new Date(y,m+1,0)};
  }
}

function shiftRangeBack(start, end){
  const days = Math.round((end-start)/(1000*60*60*24)) + 1;
  const newEnd = new Date(start); newEnd.setDate(newEnd.getDate()-1);
  const newStart = new Date(newEnd); newStart.setDate(newStart.getDate()-days+1);
  return {start:newStart, end:newEnd};
}

function computeEconomicsForRange(start, end){
  const s = state.settings;
  const materialPerPiece = s.materialCostPer12000 / 12000; // POP+CaCO3 base, applies to both types
  const colorCostPerPiece = s.colorPiecesPerTin > 0 ? s.colorTinCost / s.colorPiecesPerTin : 0;
  const revenuePerPieceWhite = s.pricePerBox / s.boxSize;
  const revenuePerPieceColored = s.colorPricePerBox / s.boxSize;
  const laborPerPiece = s.laborPerMold / s.moldSize;
  const transportPerPiece = s.transportPer12000 / 12000;
  const costPerPieceWhite = materialPerPiece + laborPerPiece + transportPerPiece;
  const costPerPieceColored = materialPerPiece + colorCostPerPiece + laborPerPiece + transportPerPiece;
  const profitPerPieceBeforeRent = revenuePerPieceWhite - costPerPieceWhite; // used for baseline breakeven/capacity (white chalk)

  const capacityMoldsPerMonth = s.moldsPerDay * s.daysPerMonth;
  const capacityPiecesPerMonth = capacityMoldsPerMonth * s.moldSize;

  const filteredProduction = state.production.filter(p => inRange(p.date, start, end));
  const filteredSales = state.sales.filter(x => inRange(x.date, start, end));

  const prodWhite = filteredProduction.filter(p => (p.type||'white') === 'white');
  const prodColored = filteredProduction.filter(p => p.type === 'colored');
  const salesWhite = filteredSales.filter(x => (x.type||'white') === 'white');
  const salesColored = filteredSales.filter(x => x.type === 'colored');

  const producedPiecesWhite = prodWhite.reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);
  const producedPiecesColored = prodColored.reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);
  const producedPieces = producedPiecesWhite + producedPiecesColored;
  const totalMolds = filteredProduction.reduce((sum,p)=> sum + p.molds, 0);

  const soldBoxesWhite = salesWhite.reduce((sum,x)=> sum + x.boxes, 0);
  const soldBoxesColored = salesColored.reduce((sum,x)=> sum + x.boxes, 0);
  const soldPiecesWhite = soldBoxesWhite * s.boxSize;
  const soldPiecesColored = soldBoxesColored * s.boxSize;
  const soldPieces = soldPiecesWhite + soldPiecesColored;
  const soldBoxes = soldBoxesWhite + soldBoxesColored;

  const monthsInRange = monthsBetween(start, end);
  const rentCost = s.rentPerMonth * monthsInRange;

  const revenueWhite = soldPiecesWhite * revenuePerPieceWhite;
  const revenueColored = soldPiecesColored * revenuePerPieceColored;
  const revenue = revenueWhite + revenueColored;

  const materials = (producedPieces * materialPerPiece) + (producedPiecesColored * colorCostPerPiece);
  const labor = totalMolds * s.laborPerMold;
  const transport = producedPieces * transportPerPiece;
  const totalCosts = materials + labor + transport + rentCost;
  const netProfit = revenue - totalCosts;
  const profitPerPieceSold = soldPieces > 0 ? netProfit / soldPieces : null;
  const stockGap = producedPieces - soldPieces;
  const stockGapWhite = producedPiecesWhite - soldPiecesWhite;
  const stockGapColored = producedPiecesColored - soldPiecesColored;

  const breakevenPieces = s.rentPerMonth / profitPerPieceBeforeRent;
  const breakevenMolds = breakevenPieces / s.moldSize;
  const breakevenSchools = breakevenPieces / s.pieceDefault;
  const capacitySchools = capacityPiecesPerMonth / s.pieceDefault;

  return {start, end, monthsInRange, rentCost, materialPerPiece, colorCostPerPiece,
    revenuePerPieceWhite, revenuePerPieceColored, costPerPieceWhite, costPerPieceColored,
    profitPerPieceBeforeRent, capacityMoldsPerMonth, capacityPiecesPerMonth,
    producedPieces, producedPiecesWhite, producedPiecesColored, totalMolds,
    soldPieces, soldPiecesWhite, soldPiecesColored, soldBoxes, soldBoxesWhite, soldBoxesColored,
    stockGap, stockGapWhite, stockGapColored, filteredProduction, filteredSales,
    revenue, revenueWhite, revenueColored, materials, labor, transport, totalCosts, netProfit, profitPerPieceSold,
    breakevenPieces, breakevenMolds, breakevenSchools, capacitySchools};
}

function computeEconomics(){
  const {start, end} = getPeriodRange(periodFilter, customStart, customEnd);
  const current = computeEconomicsForRange(start, end);
  const priorRange = shiftRangeBack(start, end);
  const prior = computeEconomicsForRange(priorRange.start, priorRange.end);
  const monthly = computeMonthlyBreakdown(start, end);
  return {...current, periodLabel: PERIOD_LABELS[periodFilter], prior, monthly};
}

function computeMonthlyBreakdown(start, end){
  const rows = [];
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);
  const last = new Date(end.getFullYear(), end.getMonth(), 1);
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  while(cursor <= last){
    const mStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const mEnd = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
    const eco = computeEconomicsForRange(mStart, mEnd);
    rows.push({
      label: monthNames[cursor.getMonth()] + ' ' + cursor.getFullYear(),
      produced: eco.producedPieces,
      sold: eco.soldPieces,
      revenue: eco.revenue,
      profit: eco.netProfit
    });
    cursor = new Date(cursor.getFullYear(), cursor.getMonth()+1, 1);
  }
  return rows;
}

function buildTrendChart(rows){
  const W = 700, H = 240, padL = 46, padR = 16, padT = 20, padB = 42;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const n = rows.length;
  const maxVal = Math.max(1, ...rows.map(r => Math.max(r.produced, r.sold)));
  const groupW = chartW / n;
  const barW = Math.min(26, groupW * 0.32);

  const yTicks = 4;
  let gridLines = '';
  for(let i=0;i<=yTicks;i++){
    const val = Math.round(maxVal * i / yTicks);
    const y = padT + chartH - (chartH * i / yTicks);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(244,241,230,0.08)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--chalk-dim)" font-family="IBM Plex Mono, monospace">${val>=1000?Math.round(val/1000)+'k':val}</text>`;
  }

  let bars = '';
  let labels = '';
  rows.forEach((r, i) => {
    const groupX = padL + i*groupW;
    const centerX = groupX + groupW/2;
    const producedH = maxVal ? (r.produced/maxVal)*chartH : 0;
    const soldH = maxVal ? (r.sold/maxVal)*chartH : 0;
    const x1 = centerX - barW - 3;
    const x2 = centerX + 3;
    bars += `<rect x="${x1}" y="${padT+chartH-producedH}" width="${barW}" height="${producedH}" fill="var(--chalk-blue)" opacity="0.85" rx="2"/>`;
    bars += `<rect x="${x2}" y="${padT+chartH-soldH}" width="${barW}" height="${soldH}" fill="var(--chalk-yellow)" opacity="0.9" rx="2"/>`;
    labels += `<text x="${centerX}" y="${H-14}" text-anchor="middle" font-size="10" fill="var(--chalk-dim)" font-family="IBM Plex Mono, monospace">${r.label}</text>`;
    const profitColor = r.profit >= 0 ? 'var(--good)' : 'var(--danger)';
    const dotY = padT + chartH - Math.max(producedH, soldH) - 8;
    labels += `<circle cx="${centerX}" cy="${Math.max(padT+4,dotY)}" r="3" fill="${profitColor}"/>`;
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-family:'IBM Plex Mono',monospace">
      ${gridLines}
      ${bars}
      ${labels}
      <line x1="${padL}" y1="${padT+chartH}" x2="${W-padR}" y2="${padT+chartH}" stroke="rgba(244,241,230,0.25)" stroke-width="1"/>
    </svg>
    <div style="display:flex;gap:18px;justify-content:center;margin-top:6px;font-size:0.72rem;color:var(--chalk-dim)">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--chalk-blue);border-radius:2px;margin-right:5px;vertical-align:middle"></span>Produced</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--chalk-yellow);border-radius:2px;margin-right:5px;vertical-align:middle"></span>Sold</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:var(--good);border-radius:50%;margin-right:5px;vertical-align:middle"></span>Profitable month</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:var(--danger);border-radius:50%;margin-right:5px;vertical-align:middle"></span>Loss month</span>
    </div>
  `;
}

function computeWorkerEarnings(filteredProduction){
  const s = state.settings;
  const byWorker = {};
  filteredProduction.forEach(p => {
    const name = (p.worker || '').trim() || 'Unassigned';
    if(!byWorker[name]) byWorker[name] = {worker:name, molds:0, pieces:0, whiteMolds:0, coloredMolds:0};
    byWorker[name].molds += p.molds;
    byWorker[name].pieces += p.molds * p.moldSize;
    if(p.type === 'colored') byWorker[name].coloredMolds += p.molds;
    else byWorker[name].whiteMolds += p.molds;
  });
  return Object.values(byWorker)
    .map(w => ({...w, pay: w.molds * s.laborPerMold}))
    .sort((a,b)=> b.molds - a.molds);
}

function computeMaterialStock(){
  const s = state.settings;
  const materialPerPiece = s.materialCostPer12000 / 12000;
  const colorCostPerPiece = s.colorPiecesPerTin > 0 ? s.colorTinCost / s.colorPiecesPerTin : 0;

  const basePurchases = state.materialPurchases.filter(p => (p.category||'base') === 'base');
  const colourPurchases = state.materialPurchases.filter(p => p.category === 'colour');
  const totalPurchasedBase = basePurchases.reduce((sum,p)=> sum + p.amount, 0);
  const totalPurchasedColour = colourPurchases.reduce((sum,p)=> sum + p.amount, 0);
  const totalPurchased = totalPurchasedBase + totalPurchasedColour;

  const allProduction = state.production;
  const totalProducedPiecesAllTime = allProduction.reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);
  const totalProducedColoredAllTime = allProduction.filter(p=>p.type==='colored').reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);

  const totalConsumedBase = totalProducedPiecesAllTime * materialPerPiece; // POP+CaCO3 used by ALL chalk (white + colored base)
  const totalConsumedColour = totalProducedColoredAllTime * colorCostPerPiece;
  const totalConsumedValue = totalConsumedBase + totalConsumedColour;

  const remainingBaseValue = totalPurchasedBase - totalConsumedBase;
  const remainingColourValue = totalPurchasedColour - totalConsumedColour;
  const remainingValue = remainingBaseValue + remainingColourValue;
  const remainingPieces = materialPerPiece > 0 ? remainingBaseValue / materialPerPiece : 0;
  const remainingColourPieces = colorCostPerPiece > 0 ? remainingColourValue / colorCostPerPiece : 0;
  const remainingColourTins = s.colorPiecesPerTin > 0 ? remainingColourPieces / s.colorPiecesPerTin : 0;

  // Average daily production from the last 30 days of logged entries (falls back to capacity assumption if no recent data)
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const recentAll = allProduction.filter(p => new Date(p.date) >= cutoff);
  const recentPieces = recentAll.reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);
  const recentColoredPieces = recentAll.filter(p=>p.type==='colored').reduce((sum,p)=> sum + (p.molds * p.moldSize), 0);
  const avgDailyProduction = recentPieces > 0 ? recentPieces / 30 : (s.moldsPerDay * s.moldSize);
  const avgDailyColored = recentColoredPieces / 30;

  const hasBasePurchases = basePurchases.length > 0;
  const hasColourPurchases = colourPurchases.length > 0;

  const daysRemaining = (hasBasePurchases && avgDailyProduction > 0) ? remainingPieces / avgDailyProduction : null;
  const isLow = hasBasePurchases && daysRemaining !== null && daysRemaining <= s.lowStockDays;
  const colourDaysRemaining = (hasColourPurchases && avgDailyColored > 0) ? remainingColourPieces / avgDailyColored : null;
  const isColourLow = hasColourPurchases && colourDaysRemaining !== null && colourDaysRemaining <= s.lowStockDays;

  return {totalPurchased, totalPurchasedBase, totalPurchasedColour, totalConsumedValue,
    remainingValue, remainingBaseValue, remainingColourValue, remainingPieces, remainingColourPieces, remainingColourTins,
    avgDailyProduction, daysRemaining, isLow, colourDaysRemaining, isColourLow, materialPerPiece, colorCostPerPiece,
    hasBasePurchases, hasColourPurchases};
}

function computePayback(){
  const totalAssetValue = state.assets.reduce((sum,a)=> sum + (a.cost * a.quantity), 0);
  const earliest = getEarliestDate();
  const today = toDateOnly(new Date());
  const allTime = computeEconomicsForRange(earliest, today);
  const cumulativeProfit = allTime.netProfit;
  const pct = totalAssetValue > 0 ? (cumulativeProfit / totalAssetValue) * 100 : null;
  const remaining = totalAssetValue - cumulativeProfit;
  return {totalAssetValue, cumulativeProfit, pct, remaining, paidBack: totalAssetValue > 0 && cumulativeProfit >= totalAssetValue};
}

function generateInsights(e, matStock, payback){
  const insights = [];
  const s = state.settings;

  if(e.soldPieces > 0){
    if(e.netProfit < 0){
      insights.push({type:'bad', text:`Operating at a loss this period (${fmt(e.netProfit)} UGX) — costs are outpacing revenue from actual sales.`});
    } else if(e.profitPerPieceSold !== null){
      insights.push({type:'good', text:`Profitable this period at about ${fmt(e.profitPerPieceSold)} UGX per piece sold.`});
    }
  }

  const cur = e.profitPerPieceSold, prior = e.prior.profitPerPieceSold;
  if(cur !== null && prior !== null && prior !== 0){
    const pct = Math.round(((cur-prior)/Math.abs(prior))*100);
    if(pct >= 15) insights.push({type:'good', text:`Profit per piece sold is up ${pct}% versus the prior period — whatever changed, it's working.`});
    else if(pct <= -15) insights.push({type:'bad', text:`Profit per piece sold dropped ${Math.abs(pct)}% versus the prior period — worth checking costs, pricing, or discounting.`});
  }

  if(e.producedPieces > 0){
    const gapPct = Math.round((e.stockGap / e.producedPieces) * 100);
    if(gapPct >= 25) insights.push({type:'warn', text:`Producing noticeably more than you're selling — ${fmt(e.stockGap)} pieces of unsold stock built up. Consider slowing production or pushing sales to schools that are due.`});
    else if(e.stockGap < 0 && Math.abs(e.stockGap) > e.producedPieces*0.5){
      insights.push({type:'info', text:`Selling faster than you're producing this period — pulling from reserve stock.`});
    }
  }

  const monthlyCapacityUse = e.monthsInRange > 0 ? (e.producedPieces / e.monthsInRange) / e.capacityPiecesPerMonth : 0;
  if(monthlyCapacityUse < 0.5 && e.producedPieces > 0){
    insights.push({type:'info', text:`Machine is running at only ~${Math.round(monthlyCapacityUse*100)}% of capacity on average — there's room to grow without adding new fixed costs.`});
  } else if(monthlyCapacityUse >= 0.9){
    insights.push({type:'warn', text:`Running near full capacity (~${Math.round(monthlyCapacityUse*100)}%) — worth planning a bigger machine or a second shift if demand keeps growing.`});
  }

  const dueSoonCount = state.schools.map(sc=>schoolStatus(sc)).filter(st=>st.badge!=='ok').length;
  if(dueSoonCount > 0){
    insights.push({type:'info', text:`${dueSoonCount} school${dueSoonCount===1?'':'s'} have reorders due soon or overdue — reach out to confirm before they buy elsewhere.`});
  }

  if(payback.totalAssetValue > 0){
    if(payback.paidBack){
      insights.push({type:'good', text:`Fully paid back your ${fmt(payback.totalAssetValue)} UGX startup investment — you're now ${fmt(payback.cumulativeProfit - payback.totalAssetValue)} UGX ahead in lifetime profit.`});
    } else if(payback.pct !== null){
      insights.push({type:'info', text:`You've recovered about ${Math.max(0,Math.round(payback.pct))}% of your total startup investment (${fmt(payback.totalAssetValue)} UGX) through profits so far.`});
    }
  }

  if(matStock.daysRemaining !== null){
    if(matStock.daysRemaining <= 0){
      insights.push({type:'bad', text:`Base material (POP/CaCO3) stock appears used up or over-consumed — log a new purchase or double check your Materials entries.`});
    } else if(matStock.isLow){
      insights.push({type:'warn', text:`Only about ${Math.round(matStock.daysRemaining)} day${Math.round(matStock.daysRemaining)===1?'':'s'} of base material (POP/CaCO3) left at your recent pace — time to reorder.`});
    }
  }
  if(matStock.isColourLow && matStock.colourDaysRemaining > 0){
    insights.push({type:'warn', text:`Only about ${Math.round(matStock.colourDaysRemaining)} day${Math.round(matStock.colourDaysRemaining)===1?'':'s'} of colour tins left at your recent colored-chalk pace — time to reorder.`});
  }

  return insights;
}

function renderInsights(insights){
  if(insights.length === 0) return '';
  const iconFor = {good:'✓', warn:'!', bad:'✕', info:'i'};
  const colorFor = {good:'var(--good)', warn:'var(--chalk-yellow)', bad:'var(--danger)', info:'var(--chalk-blue)'};
  return `
    <h2 class="section-title">Insights</h2>
    <div class="card" style="padding:6px 4px;margin-bottom:26px">
      ${insights.map(ins => `
        <div style="display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid rgba(244,241,230,0.07)">
          <span style="flex-shrink:0;width:20px;height:20px;border-radius:50%;background:${colorFor[ins.type]};color:#1a1a1a;font-size:0.7rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px">${iconFor[ins.type]}</span>
          <span style="font-size:0.88rem;line-height:1.5">${ins.text}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPeriodBar(){
  const opts = Object.keys(PERIOD_LABELS).map(k =>
    `<option value="${k}"${k===periodFilter?' selected':''}>${PERIOD_LABELS[k]}</option>`
  ).join('');
  const customBit = periodFilter === 'custom' ? `
    <input type="date" id="period-start" value="${customStart || ''}" style="max-width:150px">
    <span style="color:var(--chalk-dim);align-self:center">to</span>
    <input type="date" id="period-end" value="${customEnd || ''}" style="max-width:150px">
  ` : '';
  return `
    <div class="flex-between" style="margin-bottom:20px;gap:10px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label style="margin:0;white-space:nowrap">Showing</label>
        <select id="period-select" style="max-width:170px">${opts}</select>
        ${customBit}

}

function schoolStatus(school){
  const s = state.settings;
  const last = new Date(school.lastOrder);
  const next = new Date(last);
  next.setMonth(next.getMonth() + 3);
  const today = new Date();
  const daysLeft = Math.round((next - today) / (1000*60*60*24));
  let badge, label;
  if(daysLeft < 0){ badge='due'; label='Overdue'; }
  else if(daysLeft <= 14){ badge='soon'; label=daysLeft+'d left'; }
  else { badge='ok'; label=daysLeft+'d left'; }
  return {next, daysLeft, badge, label};
}

  {id:'sales', label:'Sales'},

    `<button class="tab${t.id===activeTab?' active':''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');

function renderGate(){
  renderRoleBar();
  const root = document.getElementById('root');

  if(!role){
    document.getElementById('tabs').innerHTML = '';
    root.innerHTML = `
      <div class="gate">
        <h2>Who's logging in?</h2>
        <p>Admin manages settings, schools and full numbers. Workers log production and sales only.</p>
        <div class="gate-choices">
          <div class="role-choice" id="choose-admin">
            <div class="icon">🔐</div>
            <div class="name">Admin</div>
            <div class="desc">Full access, PIN protected</div>
          </div>
          <div class="role-choice" id="choose-worker">
            <div class="icon">✏️</div>
            <div class="name">Worker</div>
            <div class="desc">Log production &amp; sales</div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('choose-admin').onclick = () => { role = 'admin'; unlocked = false; renderGate(); };
    document.getElementById('choose-worker').onclick = () => { role = 'worker'; activeTab = 'production'; unlocked = true; renderTabsBar(); render(); };
    return;
  }

  if(role === 'admin' && !unlocked){
    document.getElementById('tabs').innerHTML = '';
    root.innerHTML = `
      <div class="gate">
        <h2>Enter admin PIN</h2>
        <p>Ask the business owner for the PIN if you don't have it.</p>
        <input class="pin-input" id="pin-entry" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
        <div><button class="btn" id="pin-submit">Unlock</button></div>
        <p class="note" id="pin-error" style="color:var(--danger);min-height:18px;margin-top:10px;"></p>
      </div>
    `;
    document.getElementById('pin-submit').onclick = checkPin;
    document.getElementById('pin-entry').addEventListener('keydown', (ev) => { if(ev.key === 'Enter') checkPin(); });
    document.getElementById('pin-entry').focus();
    return;
  }

  activeTab = currentTabs().find(t=>t.id===activeTab) ? activeTab : currentTabs()[0].id;
  renderTabsBar();
  render();
}

function checkPin(){
  const val = document.getElementById('pin-entry').value;
  if(val === state.settings.adminPin){
    unlocked = true;
    activeTab = 'dashboard';
    renderGate();
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN — try again.';
  }
}

function render(){
  const root = document.getElementById('root');
  if(!role || (role==='admin' && !unlocked)) return;
  const allowed = currentTabs().map(t=>t.id);
  if(!allowed.includes(activeTab)) activeTab = allowed[0];
  if(activeTab === 'dashboard') root.innerHTML = renderDashboard();
  else if(activeTab === 'schools') root.innerHTML = renderSchools();
  else if(activeTab === 'production') root.innerHTML = renderProduction();
  else if(activeTab === 'sales') root.innerHTML = renderSales();
  else if(activeTab === 'assets') root.innerHTML = renderAssets();
  else if(activeTab === 'materials') root.innerHTML = renderMaterials();
  else root.innerHTML = renderSettings();
  attachHandlers();
}

function renderDashboard(){
  const e = computeEconomics();
  const negClass = e.netProfit < 0 ? ' negative' : '';
  const dueSoon = state.schools
    .map(sc => ({...sc, status: schoolStatus(sc)}))
    .filter(sc => sc.status.badge !== 'ok')
    .sort((a,b)=> a.status.daysLeft - b.status.daysLeft);

  const matStock = computeMaterialStock();
  const payback = computePayback();
  const insights = generateInsights(e, matStock, payback);

  const cur = e.profitPerPieceSold;
  const prior = e.prior.profitPerPieceSold;
  let trendHtml = `<span class="trend flat">No sales in prior period</span>`;
  if(cur !== null && prior !== null){
    const diff = cur - prior;
    const pct = prior !== 0 ? Math.round((diff/Math.abs(prior))*100) : 0;
    if(Math.abs(pct) < 1) trendHtml = `<span class="trend flat">≈ flat vs prior period</span>`;
    else if(diff > 0) trendHtml = `<span class="trend up">▲ ${pct}% vs prior period</span>`;
    else trendHtml = `<span class="trend down">▼ ${Math.abs(pct)}% vs prior period</span>`;
  } else if(cur === null){
    trendHtml = `<span class="trend flat">No sales logged in this period yet</span>`;
  }

  const stockNote = e.stockGap > 0
    ? `Producing ${fmt(e.stockGap)} more pieces than sold — building unsold stock.`
    : e.stockGap < 0
      ? `Selling ${fmt(-e.stockGap)} more pieces than produced in this period — pulling from old stock.`
      : `Production and sales are matched in this period.`;

  const lowStockBanner = matStock.isLow && matStock.daysRemaining > 0 ? `
    <div class="hero" style="border-color:rgba(224,138,127,0.4);background:linear-gradient(135deg, rgba(224,138,127,0.1), rgba(244,241,230,0.04));margin-bottom:16px">
      <div>
        <div class="label">Material stock</div>
        <div class="value negative">~${Math.round(matStock.daysRemaining)} days left</div>
      </div>
      <span class="trend down">Reorder soon</span>
    </div>
  ` : '';

  return `
    ${renderPeriodBar()}
    ${lowStockBanner}
    <div class="hero">
      <div>
        <div class="label">Profit per piece sold — ${e.periodLabel}</div>
        <div class="value${cur !== null && cur < 0 ? ' negative' : ''}">${cur !== null ? fmt(cur)+' UGX' : '—'}</div>
      </div>
      ${trendHtml}
    </div>

    ${renderInsights(insights)}

    ${payback.totalAssetValue > 0 ? `
    <h2 class="section-title">Payback progress</h2>
    <div class="card" style="padding:20px 20px 18px">
      <div class="flex-between" style="margin-bottom:10px">
        <span style="font-size:0.85rem;color:var(--chalk-dim)">${payback.paidBack ? 'Fully recovered' : fmt(Math.max(0,payback.pct))+'% recovered'}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--chalk-dim)">${fmt(payback.cumulativeProfit)} / ${fmt(payback.totalAssetValue)} UGX</span>
      </div>
      <div style="height:10px;background:rgba(244,241,230,0.1);border-radius:6px;overflow:hidden">
        <div style="height:100%;width:${Math.min(100,Math.max(0,payback.pct))}%;background:${payback.paidBack ? 'var(--good)' : 'var(--chalk-yellow)'};border-radius:6px;transition:width 0.3s"></div>
      </div>
      <p class="note" style="margin-top:10px">${payback.paidBack
        ? `Investment fully paid back — you're ${fmt(payback.cumulativeProfit - payback.totalAssetValue)} UGX ahead in lifetime profit.`
        : `About ${fmt(Math.max(0,payback.remaining))} UGX of your startup investment left to recover, based on lifetime profit.`}</p>
    </div>
    ` : ''}

    <h2 class="section-title">${e.periodLabel}</h2>
    <div class="cards">
      <div class="card"><div class="label">Produced</div><div class="value">${fmt(e.producedPieces)}</div><div class="sub">pieces logged</div></div>
      <div class="card"><div class="label">Sold</div><div class="value">${fmt(e.soldPieces)}</div><div class="sub">${fmt(e.soldBoxes)} boxes logged</div></div>
      <div class="card"><div class="label">Revenue</div><div class="value">${fmt(e.revenue)}</div><div class="sub">from actual sales</div></div>
      <div class="card profit${negClass}"><div class="label">Net profit</div><div class="value">${fmt(e.netProfit)}</div><div class="sub">rent×${e.monthsInRange} included</div></div>
    </div>
    <div class="cards" style="margin-top:-8px">
      <div class="card"><div class="label">White — produced/sold</div><div class="value" style="font-size:1.1rem">${fmt(e.producedPiecesWhite)} / ${fmt(e.soldPiecesWhite)}</div><div class="sub">${fmt(e.revenueWhite)} UGX revenue</div></div>
      <div class="card"><div class="label">Colored — produced/sold</div><div class="value" style="font-size:1.1rem">${fmt(e.producedPiecesColored)} / ${fmt(e.soldPiecesColored)}</div><div class="sub">${fmt(e.revenueColored)} UGX revenue</div></div>
    </div>
    <p class="note" style="margin:-8px 0 22px">${stockNote}</p>

    ${e.monthly.length > 1 ? `
    <h2 class="section-title">Monthly trend</h2>
    <div class="card" style="padding:20px 18px 8px">
      ${buildTrendChart(e.monthly)}
    </div>

    <h2 class="section-title">Month by month</h2>
    <table>
      <thead><tr><th>Month</th><th>Produced</th><th>Sold</th><th>Revenue</th><th>Profit</th></tr></thead>
      <tbody>
        ${e.monthly.map(r => `
          <tr>
            <td>${r.label}</td>
            <td>${fmt(r.produced)}</td>
            <td>${fmt(r.sold)}</td>
            <td>${fmt(r.revenue)}</td>
            <td style="color:${r.profit>=0?'var(--good)':'var(--danger)'}">${fmt(r.profit)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    ` : ''}

    <h2 class="section-title">Capacity &amp; breakeven <span style="font-family:'Inter';font-size:0.65rem;color:var(--chalk-dim);text-transform:none;letter-spacing:0">(always per month)</span></h2>
    <div class="cards">
      <div class="card"><div class="label">Full capacity</div><div class="value">${fmt(e.capacityPiecesPerMonth)}</div><div class="sub">${fmt(e.capacityMoldsPerMonth)} molds/month</div></div>
      <div class="card"><div class="label">Breakeven</div><div class="value">${fmt(e.breakevenPieces)}</div><div class="sub">pieces just to cover rent</div></div>
      <div class="card"><div class="label">Schools to breakeven</div><div class="value">~${Math.ceil(e.breakevenSchools)}</div><div class="sub">at ${fmt(state.settings.pieceDefault)} pcs/school/3mo</div></div>
      <div class="card"><div class="label">Schools at full capacity</div><div class="value">~${Math.floor(e.capacitySchools)}</div><div class="sub">machine's ceiling</div></div>
    </div>

    <h2 class="section-title">Orders needing attention (${dueSoon.length})</h2>
    <table>
      <thead><tr><th>School</th><th>Pieces / order</th><th>Next order due</th><th>Status</th></tr></thead>
      <tbody>
        ${dueSoon.length === 0 ? `<tr class="empty-row"><td colspan="4">Nothing due soon — nice and quiet.</td></tr>` :
          dueSoon.map(sc => `
            <tr>
              <td>${sc.name}</td>
              <td>${fmt(sc.pieces)}</td>
              <td>${sc.status.next.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
              <td><span class="badge ${sc.status.badge}">${sc.status.label}</span></td>

      </tbody>
    </table>
  `;
}

      <div class="card${m.isColourLow ? ' profit negative' : ''}"><div class="label">Days remaining</div><div class="value">${m.colourDaysRemaining !== null ? '~'+Math.max(0,Math.round(m.colourDaysRemaining)) : '—'}</div><div class="sub">at recent colored-chalk pace</div></div>
      <div class="card"><div class="label">Stock value</div><div class="value">${fmt(m.remainingColourValue)}</div><div class="sub">UGX worth of colour left</div></div>
      <div class="card"><div class="label">Stock in tins</div><div class="value">${m.remainingColourTins.toFixed(1)}</div><div class="sub">tins' worth remaining</div></div>
      <div class="card"><div class="label">Total ever purchased</div><div class="value">${fmt(m.totalPurchasedColour)}</div><div class="sub">UGX, all time</div></div>
    </div>
    ${m.isColourLow ? `<p class="note" style="color:var(--danger)">Colour stock is running low — log a new purchase soon.</p>` :
      !m.hasColourPurchases ? `<p class="note">No colour purchases logged yet — log one above to start tracking stock.</p>` : ''}
    <p class="note" style="margin-top:10px">These are estimates based on money spent vs. pieces produced, assuming standard cost-per-piece. Log every purchase, tagged correctly as Base or Colour, for accuracy.</p>

    <h2 class="section-title">Purchase history (${purchases.length})</h2>
    <table>
      <thead><tr><th>Date</th><th>Material</th><th>Amount</th><th>Notes</th><th></th></tr></thead>
      <tbody>
        ${purchases.length === 0 ? `<tr class="empty-row"><td colspan="5">No material purchases logged yet.</td></tr>` :
          purchases.map(p => `
            <tr>
              <td>${new Date(p.date).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
              <td>${p.category === 'colour' ? 'Colour' : 'Base'}</td>
              <td>${fmt(p.amount)}</td>
              <td>${p.notes ? p.notes : '—'}</td>
              <td><button class="btn danger-outline" data-delete-material="${p.id}">Remove</button></td>
            </tr>
          `).join('')}
      </tbody>
    </table>
  `;
}

function renderSettings(){
  const s = state.settings;
  const derivedCostPerMold = (s.popPerMoldGrams/1000)*s.popPricePerKg + (s.caco3PerMoldGrams/1000)*s.caco3PricePerKg;
  const derivedCostPerPiece = s.moldSize > 0 ? derivedCostPerMold / s.moldSize : 0;
  const derivedCostPer12000 = derivedCostPerPiece * 12000;
  return `
    <h2 class="section-title">Base material — POP &amp; CaCO3</h2>
    <p class="note" style="margin-bottom:12px">${fmt(s.popPerMoldGrams)}g POP + ${fmt(s.caco3PerMoldGrams)}g CaCO3 makes one mold (${fmt(s.moldSize)} pieces). Set your price per kg for each and the cost per piece is calculated automatically — this stays in sync with the Materials tab.</p>
    <div class="settings-form">
      <div><label>POP price per kg (UGX)</label><input id="set-poppricekg" type="number" value="${s.popPricePerKg}"></div>
      <div><label>CaCO3 price per kg (UGX)</label><input id="set-caco3pricekg" type="number" value="${s.caco3PricePerKg}"></div>
      <div><label>POP per mold (g)</label><input id="set-pop" type="number" value="${s.popPerMoldGrams}"></div>
      <div><label>CaCO3 per mold (g)</label><input id="set-caco3" type="number" value="${s.caco3PerMoldGrams}"></div>
    </div>
    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="label">Cost per mold</div><div class="value" style="font-size:1.2rem">${fmt(derivedCostPerMold)}</div><div class="sub">UGX for ${fmt(s.moldSize)} pieces</div></div>
      <div class="card"><div class="label">Cost per piece</div><div class="value" style="font-size:1.2rem">${derivedCostPerPiece.toFixed(2)}</div><div class="sub">UGX</div></div>
      <div class="card"><div class="label">≈ Cost per 12,000 pcs</div><div class="value" style="font-size:1.2rem">${fmt(derivedCostPer12000)}</div><div class="sub">UGX, for reference</div></div>
    </div>

    <h2 class="section-title">Other costs &amp; rates</h2>
    <div class="settings-form">
      <div><label>Selling price per box (UGX)</label><input id="set-price" type="number" value="${s.pricePerBox}"></div>
      <div><label>Pieces per box</label><input id="set-boxsize" type="number" value="${s.boxSize}"></div>
      <div><label>Pieces per mold</label><input id="set-moldsize" type="number" value="${s.moldSize}"></div>
      <div><label>Labor pay per mold (UGX)</label><input id="set-labor" type="number" value="${s.laborPerMold}"></div>
      <div><label>Transport cost per 12,000 pcs (UGX)</label><input id="set-transport" type="number" value="${s.transportPer12000}"></div>
      <div><label>Rent per month (UGX)</label><input id="set-rent" type="number" value="${s.rentPerMonth}"></div>
      <div><label>Molds per day (worker avg)</label><input id="set-moldsday" type="number" value="${s.moldsPerDay}"></div>
      <div><label>Working days per month</label><input id="set-days" type="number" value="${s.daysPerMonth}"></div>
      <div><label>Default pieces per school order</label><input id="set-piecedefault" type="number" value="${s.pieceDefault}"></div>
      <div><label>Low stock warning (days)</label><input id="set-lowstock" type="number" value="${s.lowStockDays}"></div>
    </div>
    <button class="btn" id="save-settings" style="margin-top:6px">Save settings</button>
    <p class="note" style="margin-top:16px">These numbers drive every calculation on the Dashboard, Schools, and Production tabs. Update them any time your costs, machine, or worker rate changes — everything recalculates instantly.</p>

    <h2 class="section-title">Colored chalk</h2>
    <div class="settings-form">
      <div><label>Colored chalk price per box (UGX)</label><input id="set-colorprice" type="number" value="${s.colorPricePerBox}"></div>
      <div><label>Cost per tin of colour (UGX)</label><input id="set-colortincost" type="number" value="${s.colorTinCost}"></div>
      <div><label>Pieces colored per tin</label><input id="set-colorpertin" type="number" value="${s.colorPiecesPerTin}"></div>
    </div>
    <p class="note" style="margin-top:10px">Colored chalk uses the same POP/CaCO3 base as white, plus colour cost. Its material cost = base cost/piece + (tin cost ÷ pieces per tin).</p>

    <h2 class="section-title">Admin access</h2>
    <div class="form-grid" style="max-width:260px">
      <div><label>Admin PIN</label><input id="set-pin" type="text" inputmode="numeric" maxlength="8" value="${s.adminPin}"></div>
    </div>
    <p class="note">Share this PIN only with people who should see settings, schools, and full financials. Workers logging in via the Worker option never see this screen.</p>

    <h2 class="section-title">Export data</h2>
    <p class="note" style="margin-bottom:12px">Download your records any time — for your own backup, to open in Excel, or to hand to an accountant, bank, or supplier.</p>
    <div class="flex-between" style="gap:8px;flex-wrap:wrap">
      <button class="btn secondary" id="export-all">Full backup (JSON)</button>
      <button class="btn secondary" id="export-production">Production (CSV)</button>
      <button class="btn secondary" id="export-sales">Sales (CSV)</button>
      <button class="btn secondary" id="export-schools">Schools (CSV)</button>
      <button class="btn secondary" id="export-assets">Assets (CSV)</button>
      <button class="btn secondary" id="export-materials">Materials (CSV)</button>
    </div>

    <h2 class="section-title">Restore from backup</h2>
    <p class="note" style="margin-bottom:12px">Load a full backup (JSON) you exported earlier — useful if you're moving to a new device, or want to recover after clearing data. This replaces everything currently in the app.</p>
    <input type="file" id="import-file" accept="application/json" style="max-width:280px">
    <button class="btn secondary" id="import-btn" style="margin-left:8px">Restore</button>
    <p class="note" id="import-status" style="margin-top:8px"></p>

    <h2 class="section-title">Reset</h2>
    <p class="note" style="margin-bottom:12px">Wipes all schools, production, sales, assets, and material records. Settings and PIN are kept. This cannot be undone — export a backup first if unsure.</p>
    <button class="btn danger-outline" id="reset-all" style="padding:9px 16px">Clear all records</button>
  `;
}

function attachHandlers(){
  const periodSelect = document.getElementById('period-select');
  if(periodSelect) periodSelect.onchange = () => {
    periodFilter = periodSelect.value;
    if(periodFilter === 'custom' && !customStart){
      const {start,end} = getPeriodRange('this_month', null, null);
      customStart = start.toISOString().slice(0,10);
      customEnd = end.toISOString().slice(0,10);
    }
    render();
  };
  const periodStart = document.getElementById('period-start');
  const periodEnd = document.getElementById('period-end');
  if(periodStart) periodStart.onchange = () => { customStart = periodStart.value; render(); };
  if(periodEnd) periodEnd.onchange = () => { customEnd = periodEnd.value; render(); };

  const addSchoolBtn = document.getElementById('add-school');
  if(addSchoolBtn) addSchoolBtn.onclick = async () => {
    const name = document.getElementById('sc-name').value.trim();
    const pieces = parseFloat(document.getElementById('sc-pieces').value) || state.settings.pieceDefault;
    const date = document.getElementById('sc-date').value;
    if(!name){ toast('Enter a school name'); return; }
    state.schools.push({id: 's'+Date.now(), name, pieces, lastOrder: date});
    await saveSchools();
    toast('School added');
    render();
  };

  document.querySelectorAll('[data-reorder]').forEach(b => {
    b.onclick = async () => {
      const sc = state.schools.find(x => x.id === b.dataset.reorder);
      if(sc){ sc.lastOrder = new Date().toISOString().slice(0,10); await saveSchools(); toast('Marked as reordered today'); render(); }
    };
  });
  document.querySelectorAll('[data-delete-school]').forEach(b => {
    b.onclick = async () => {
      state.schools = state.schools.filter(x => x.id !== b.dataset.deleteSchool);
      await saveSchools(); toast('School removed'); render();
    };
  });

  const addProdBtn = document.getElementById('add-production');
  if(addProdBtn) addProdBtn.onclick = async () => {
    const date = document.getElementById('pr-date').value;
    const type = document.getElementById('pr-type').value;
    const worker = document.getElementById('pr-worker').value.trim();
    const molds = parseFloat(document.getElementById('pr-molds').value);
    const moldSize = parseFloat(document.getElementById('pr-moldsize').value) || state.settings.moldSize;
    if(!molds || molds <= 0){ toast('Enter number of molds'); return; }
    state.production.push({id:'p'+Date.now(), date, type, worker, molds, moldSize});
    await saveProduction();
    toast('Production logged');
    render();
  };
  document.querySelectorAll('[data-delete-prod]').forEach(b => {
    b.onclick = async () => {
      state.production = state.production.filter(x => x.id !== b.dataset.deleteProd);
      await saveProduction(); toast('Entry removed'); render();
    };
  });

  const addSaleBtn = document.getElementById('add-sale');
  if(addSaleBtn) addSaleBtn.onclick = async () => {
    const date = document.getElementById('sl-date').value;
    const type = document.getElementById('sl-type').value;
    const boxes = parseFloat(document.getElementById('sl-boxes').value);
    const buyer = document.getElementById('sl-buyer').value.trim();
    if(!boxes || boxes <= 0){ toast('Enter number of boxes sold'); return; }
    state.sales.push({id:'sl'+Date.now(), date, type, boxes, buyer});
    await saveSales();
    toast('Sale logged');
    render();
  };
  document.querySelectorAll('[data-delete-sale]').forEach(b => {
    b.onclick = async () => {
      state.sales = state.sales.filter(x => x.id !== b.dataset.deleteSale);
      await saveSales(); toast('Entry removed'); render();
    };
  });

  const addAssetBtn = document.getElementById('add-asset');
  if(addAssetBtn) addAssetBtn.onclick = async () => {
    const name = document.getElementById('as-name').value.trim();
    const category = document.getElementById('as-category').value;
    const cost = parseFloat(document.getElementById('as-cost').value);
    const quantity = parseFloat(document.getElementById('as-qty').value) || 1;
    const date = document.getElementById('as-date').value;
    const notes = document.getElementById('as-notes').value.trim();
    if(!name){ toast('Enter an asset name'); return; }
    if(!cost || cost <= 0){ toast('Enter a cost per unit'); return; }
    state.assets.push({id:'as'+Date.now(), name, category, cost, quantity, date, notes});
    await saveAssets();
    toast('Asset added');
    render();
  };
  document.querySelectorAll('[data-delete-asset]').forEach(b => {
    b.onclick = async () => {
      state.assets = state.assets.filter(x => x.id !== b.dataset.deleteAsset);
      await saveAssets(); toast('Asset removed'); render();
    };
  });

  const addMaterialBtn = document.getElementById('add-material');
  if(addMaterialBtn) addMaterialBtn.onclick = async () => {
    const date = document.getElementById('mp-date').value;
    const category = document.getElementById('mp-category').value;
    const amount = parseFloat(document.getElementById('mp-amount').value);
    const notes = document.getElementById('mp-notes').value.trim();
    if(!amount || amount <= 0){ toast('Enter an amount spent'); return; }
    state.materialPurchases.push({id:'mp'+Date.now(), date, category, amount, notes});
    await saveMaterialPurchases();
    toast('Purchase logged');
    render();
  };
  document.querySelectorAll('[data-delete-material]').forEach(b => {
    b.onclick = async () => {
      state.materialPurchases = state.materialPurchases.filter(x => x.id !== b.dataset.deleteMaterial);
      await saveMaterialPurchases(); toast('Entry removed'); render();
    };
  });

  const exportAllBtn = document.getElementById('export-all');
  if(exportAllBtn) exportAllBtn.onclick = exportAllJSON;
  const exportProdBtn = document.getElementById('export-production');
  if(exportProdBtn) exportProdBtn.onclick = exportProductionCSV;
  const exportSalesBtn = document.getElementById('export-sales');
  if(exportSalesBtn) exportSalesBtn.onclick = exportSalesCSV;
  const exportSchoolsBtn = document.getElementById('export-schools');
  if(exportSchoolsBtn) exportSchoolsBtn.onclick = exportSchoolsCSV;
  const exportAssetsBtn = document.getElementById('export-assets');
  if(exportAssetsBtn) exportAssetsBtn.onclick = exportAssetsCSV;
  const exportMaterialsBtn = document.getElementById('export-materials');
  if(exportMaterialsBtn) exportMaterialsBtn.onclick = exportMaterialsCSV;

  const importBtn = document.getElementById('import-btn');
  if(importBtn) importBtn.onclick = () => {
    const fileInput = document.getElementById('import-file');
    const statusEl = document.getElementById('import-status');
    if(!fileInput.files || fileInput.files.length === 0){
      if(statusEl) statusEl.textContent = 'Choose a backup file first.';
      return;
    }
    if(!confirm('This will replace all current data with the backup file. Continue?')) return;
    importBackup(fileInput.files[0]);
  };

  const resetBtn = document.getElementById('reset-all');
  if(resetBtn) resetBtn.onclick = () => {
    if(!confirm('This will permanently delete all schools, production, sales, assets, and material records. Settings and PIN are kept. This cannot be undone. Continue?')) return;
    if(!confirm('Are you absolutely sure? Consider exporting a backup first.')) return;
    resetAllRecords();
  };

  const saveSettingsBtn = document.getElementById('save-settings');
  if(saveSettingsBtn) saveSettingsBtn.onclick = async () => {
    state.settings = {
      popPricePerKg: parseFloat(document.getElementById('set-poppricekg').value) || 0,
      caco3PricePerKg: parseFloat(document.getElementById('set-caco3pricekg').value) || 0,
      pricePerBox: parseFloat(document.getElementById('set-price').value) || DEFAULT_SETTINGS.pricePerBox,
      boxSize: parseFloat(document.getElementById('set-boxsize').value) || DEFAULT_SETTINGS.boxSize,
      moldSize: parseFloat(document.getElementById('set-moldsize').value) || DEFAULT_SETTINGS.moldSize,
      laborPerMold: parseFloat(document.getElementById('set-labor').value) || DEFAULT_SETTINGS.laborPerMold,
      transportPer12000: parseFloat(document.getElementById('set-transport').value) || DEFAULT_SETTINGS.transportPer12000,
      rentPerMonth: parseFloat(document.getElementById('set-rent').value) || DEFAULT_SETTINGS.rentPerMonth,
      moldsPerDay: parseFloat(document.getElementById('set-moldsday').value) || DEFAULT_SETTINGS.moldsPerDay,
      daysPerMonth: parseFloat(document.getElementById('set-days').value) || DEFAULT_SETTINGS.daysPerMonth,
      pieceDefault: parseFloat(document.getElementById('set-piecedefault').value) || DEFAULT_SETTINGS.pieceDefault,
      lowStockDays: parseFloat(document.getElementById('set-lowstock').value) || DEFAULT_SETTINGS.lowStockDays,
      colorPricePerBox: parseFloat(document.getElementById('set-colorprice').value) || DEFAULT_SETTINGS.colorPricePerBox,
      colorTinCost: parseFloat(document.getElementById('set-colortincost').value) || 0,
      colorPiecesPerTin: parseFloat(document.getElementById('set-colorpertin').value) || DEFAULT_SETTINGS.colorPiecesPerTin,
      popPerMoldGrams: parseFloat(document.getElementById('set-pop').value) || DEFAULT_SETTINGS.popPerMoldGrams,
      caco3PerMoldGrams: parseFloat(document.getElementById('set-caco3').value) || DEFAULT_SETTINGS.caco3PerMoldGrams,
      adminPin: (document.getElementById('set-pin').value || '').trim() || DEFAULT_SETTINGS.adminPin
    };
    state.settings.materialCostPer12000 = deriveMaterialCostPer12000(state.settings);
    await saveSettings();
    toast('Settings saved');
    render();
  };
}

loadAll();
</script>
</body>
</html>
